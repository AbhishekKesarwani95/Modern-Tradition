  <head>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <meta property="og:title" content="Next Trip Prayagraj — Sacred Stays & Yatra Planning" />
    <meta property="og:description" content="Premium sacred stays, Triveni Sangam yatra, Kumbh Mela 2026 packages, sattvik meals, and expert pilgrimage planning in Prayagraj." />
    <meta property="og:image" content="/images/triveni-sangam-dawn.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Next Trip Prayagraj",
      "description": "Prayagraj-based tours and stays agency for yatris, pilgrims, and tourists. Sacred stays, Triveni Sangam yatra, Kumbh Mela packages.",
      "url": "https://nexttripprayagraj.com",
      "telephone": "+91-9999999999",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Prayagraj",
        "addressRegion": "Uttar Pradesh",
        "addressCountry": "IN"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script type="text/javascript">
      (function () {
        var supported = ['hi','bn','ta','te','gu','mr','pa','ur','ml','kn','or'];

        function getCookie(name) {
          var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
          return match ? decodeURIComponent(match[2]) : null;
        }

        function setGoogTransCookie(lang) {
          var value = '/en/' + lang;
          document.cookie = 'googtrans=' + value + '; path=/';
          document.cookie = 'googtrans=' + value + '; path=/; domain=' + location.hostname;
        }

        var existing = getCookie('googtrans');
        if (!existing || existing === '/en/en' || existing === '/auto/en') {
          var browserLangs = (navigator.languages && navigator.languages.length)
            ? navigator.languages
            : [navigator.language || navigator.userLanguage || 'en'];

          var chosen = null;
          for (var i = 0; i < browserLangs.length; i++) {
            var code = browserLangs[i].toLowerCase().split('-')[0];
            if (code !== 'en' && supported.indexOf(code) !== -1) {
              chosen = code;
              break;
            }
          }

          if (chosen) {
            setGoogTransCookie(chosen);
          }
        }
      })();

      function googleTranslateElementInit() {
        if (typeof google !== 'undefined' && google.translate) {
          new google.translate.TranslateElement(
            {
              pageLanguage: 'en',
              includedLanguages: 'hi,en,bn,ta,te,gu,mr,pa,ur,ml,kn,or',
              layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
              autoDisplay: false
            },
            'google_translate_element'
          );
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" defer></script>
  </body>
</html>
