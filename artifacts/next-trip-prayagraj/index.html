    <script type="text/javascript">
      (function () {
        function getCookie(name) {
          var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
          return match ? decodeURIComponent(match[2]) : null;
        }

        function setGoogTransCookie(lang) {
          var value = '/en/' + lang;
          document.cookie = 'googtrans=' + value + '; path=/';
          document.cookie = 'googtrans=' + value + '; path=/; domain=' + location.hostname;
        }

        if (localStorage.getItem('ntp_lang_pref') === 'en') {
          return;
        }

        var existing = getCookie('googtrans');
        if (!existing || existing === '/en/en' || existing === '/auto/en') {
          var browserLangs = (navigator.languages && navigator.languages.length)
            ? navigator.languages
            : [navigator.language || navigator.userLanguage || 'en'];

          var chosen = null;
          for (var i = 0; i < browserLangs.length; i++) {
            var code = browserLangs[i].toLowerCase().split('-')[0];
            if (code && code !== 'en') {
              chosen = code;
              break;
            }
          }

          if (chosen) {
            setGoogTransCookie(chosen);
          }
        }
      })();

      function googleTranslateElementInit() {
        if (typeof google !== 'undefined' && google.translate) {
          new google.translate.TranslateElement(
            {
              pageLanguage: 'en',
              autoDisplay: false
            },
            'google_translate_element'
          );
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" defer></script>
